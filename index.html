<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wahid Kuis — Duel Bot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #05060a; --panel: #0d1117; --line: #1e2633;
    --txt: #e6edf3; --dim: #6a7690;
    --p1: #22d3ee; --p2: #f472b6; --green: #4ade80; --red: #f87171;
  }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--txt); font-family:'Share Tech Mono',monospace; overflow:hidden; }
  
  #app { height:100%; display:flex; flex-direction:column; position:relative; z-index:1; }
  .bg-grid {
    position:fixed; inset:0; z-index:0;
    background-image: linear-gradient(rgba(34,211,238,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.05) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(circle at center, black, transparent 90%);
    -webkit-mask-image: radial-gradient(circle at center, black, transparent 90%);
  }

  /* Header & Skor */
  header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; border-bottom:1px solid var(--line); background:rgba(13,17,23,0.8); backdrop-filter:blur(5px); }
  .player-area { display:flex; align-items:center; gap:10px; }
  .player-area.right { flex-direction: row-reverse; text-align:right; }
  
  .avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--line); background:#111; }
  .p1 .avatar { border-color:var(--p1); box-shadow:0 0 10px var(--p1); }
  .p2 .avatar { border-color:var(--p2); box-shadow:0 0 10px var(--p2); }

  .player-info { display:flex; flex-direction:column; }
  .player-name { font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:0.1em; color:var(--dim); }
  .player-val { font-family:'Orbitron',sans-serif; font-size:24px; font-weight:900; text-shadow:0 0 10px currentColor; line-height:1; }
  .p1 .player-val { color:var(--p1); }
  .p2 .player-val { color:var(--p2); }
  
  .vs-badge { font-family:'Orbitron',sans-serif; font-size:12px; color:var(--dim); background:var(--panel); padding:4px 8px; border-radius:4px; border:1px solid var(--line); }

  /* Area Utama */
  main { flex:1; display:flex; flex-direction:column; padding:20px; align-items:center; justify-content:center; overflow-y:auto; }
  
  /* Timer */
  .timer-bar { width:100%; max-width:600px; height:6px; background:var(--line); border-radius:3px; margin-bottom:20px; overflow:hidden; flex-shrink:0; }
  .timer-fill { height:100%; width:100%; background:var(--green); transition:width 0.1s linear, background-color 0.3s; }

  /* Soal */
  .question-box {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:25px 20px; text-align:center; width:100%; max-width:600px;
    margin-bottom:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5); flex-shrink:0;
  }
  .question-text { font-size:16px; line-height:1.5; color:#fff; }
  .flag-img { font-size:56px; margin-bottom:12px; line-height:1; }
  
  .progress-text { font-family:'Orbitron'; font-size:12px; color:var(--dim); margin-bottom:10px; letter-spacing:0.1em; }

  /* Tombol Jawaban */
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:600px; flex-shrink:0; }
  .option-btn {
    background:#11151c; color:var(--txt); border:2px solid var(--line);
    border-radius:10px; padding:14px 10px; font-size:15px; font-family:inherit;
    font-weight:bold; cursor:pointer; transition:all 0.2s; text-align:center;
  }
  .option-btn:active { transform:scale(0.97); }
  .option-btn:disabled { cursor:not-allowed; opacity:0.6; }
  
  /* Status Jawaban */
  .option-btn.correct { background:rgba(74,222,128,0.2); border-color:var(--green); color:var(--green); opacity:1 !important; }
  .option-btn.wrong { background:rgba(248,113,113,0.2); border-color:var(--red); color:var(--red); opacity:1 !important; }
  .option-btn.bot-pick { border-color:var(--p2); box-shadow:0 0 15px rgba(244,114,182,0.5); }

  /* Overlay / UI */
  #overlay {
    position:fixed; inset:0; background:rgba(5,6,10,0.95); z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; text-align:center; transition:opacity 0.3s; overflow-y:auto;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  .title { font-family:'Orbitron',sans-serif; font-size:32px; font-weight:900; color:var(--p1); text-shadow:0 0 20px var(--p1); margin-bottom:5px; }
  .subtitle { font-size:14px; color:var(--dim); margin-bottom:25px; letter-spacing:0.1em; text-transform:uppercase; }
  
  .upload-area {
    width:100px; height:100px; border-radius:50%; border:2px dashed var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    margin-bottom:20px; position:relative; overflow:hidden;
  }
  .upload-area img { width:100%; height:100%; object-fit:cover; display:none; }
  .upload-area span { font-size:10px; color:var(--dim); text-align:center; padding:10px; }
  
  .btn {
    background:var(--p1); color:#000; border:none; border-radius:30px;
    padding:16px 40px; font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:16px; cursor:pointer; box-shadow:0 0 20px rgba(34,211,238,0.4);
    transition:transform 0.1s; margin-top:15px;
  }
  .btn:active { transform:scale(0.95); }
  
  .result-title { font-family:'Orbitron',sans-serif; font-size:24px; margin-bottom:15px; }
  .result-score { font-size:44px; font-weight:900; margin-bottom:20px; }
  .result-score span.p1 { color:var(--p1); }
  .result-score span.p2 { color:var(--p2); }

  /* Animasi */
  @keyframes pop { 0% { opacity:1; transform:translate(-50%,-50%) scale(0.5); } 100% { opacity:0; transform:translate(-50%,-100%) scale(1.5); } }
  .feedback {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family:'Orbitron',sans-serif; font-size:40px; font-weight:900;
    pointer-events:none; z-index:20; opacity:0;
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div id="app">
  <header>
    <div class="player-area p1">
      <img src="" class="avatar" id="myAvatar" style="display:none;">
      <div class="player-info">
        <div class="player-name">KAMU</div>
        <div class="player-val" id="scoreP1">0</div>
      </div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="player-area p2 right">
      <div class="avatar" style="display:flex; align-items:center; justify-content:center; font-size:20px;">🤖</div>
      <div class="player-info">
        <div class="player-name">BOT</div>
        <div class="player-val" id="scoreP2">0</div>
      </div>
    </div>
  </header>

  <main>
    <div class="progress-text" id="progressText">SOAL 1 / 15</div>
    <div class="timer-bar">
      <div class="timer-fill" id="timerBar"></div>
    </div>

    <div class="question-box">
      <div class="flag-img" id="flagContainer"></div>
      <div class="question-text" id="questionText">Siap-siap...</div>
    </div>

    <div class="options-grid" id="optionsGrid">
      <!-- Tombol jawaban di-generate JS -->
    </div>
  </main>
</div>

<div class="feedback" id="feedback"></div>

<div id="overlay">
  <div class="title">WAHID KUIS</div>
  <div class="subtitle">15 Soal Duel Bot</div>
  
  <div id="setupScreen">
    <label class="upload-area" id="uploadLabel">
      <img id="facePreview" src="" alt="">
      <span id="uploadText">PASANG<br>FOTO</span>
      <input type="file" id="faceInput" accept="image/*" style="display:none;">
    </label>
    <br>
    <button class="btn" id="startBtn">MULAI DUEL</button>
  </div>

  <div id="overlayResult" style="display:none;">
    <div class="result-title" id="resTitle">SELESAI</div>
    <div class="result-score" id="resScore"></div>
    <button class="btn" id="restartBtn">MAIN LAGI</button>
  </div>
</div>

<script>
(() => {
  // BANK SOAL (15 SOAL)
  const db = [
    { q: "Apa ibu kota dari negara ini?", flag: "🇯🇵", ans: "Tokyo", wrong: ["Seoul", "Beijing", "Bangkok"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇧🇷", ans: "Brazil", wrong: ["Argentina", "Portugal", "Spanyol"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇨🇦", ans: "Ottawa", wrong: ["Toronto", "Vancouver", "Montreal"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇿🇦", ans: "Afrika Selatan", wrong: ["Nigeria", "Kenya", "Ghana"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇦🇺", ans: "Canberra", wrong: ["Sydney", "Melbourne", "Perth"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇸🇦", ans: "Arab Saudi", wrong: ["Uni Emirat Arab", "Qatar", "Kuwait"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇹🇷", ans: "Ankara", wrong: ["Istanbul", "Izmir", "Bursa"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇰🇷", ans: "Korea Selatan", wrong: ["Korea Utara", "Jepang", "Taiwan"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇨🇭", ans: "Bern", wrong: ["Zurich", "Geneva", "Basel"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇪🇬", ans: "Mesir", wrong: ["Maroko", "Aljazair", "Libya"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇮🇩", ans: "Jakarta", wrong: ["Bandung", "Surabaya", "Medan"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇳🇿", ans: "Selandia Baru", wrong: ["Australia", "Fiji", "Papua Nugini"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇺🇸", ans: "Washington D.C.", wrong: ["New York", "Los Angeles", "Chicago"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇮🇳", ans: "India", wrong: ["Pakistan", "Bangladesh", "Sri Lanka"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇲🇽", ans: "Mexico City", wrong: ["Guadalajara", "Monterrey", "Cancun"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇩🇪", ans: "Berlin", wrong: ["Munich", "Hamburg", "Frankfurt"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇬🇧", ans: "Inggris", wrong: ["Skotlandia", "Irlandia", "Wales"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇫🇷", ans: "Paris", wrong: ["Lyon", "Marseille", "Nice"] },
    { q: "Negara mana yang memiliki bendera ini?", flag: "🇨🇳", ans: "Tiongkok", wrong: ["Jepang", "Korea", "Vietnam"] },
    { q: "Apa ibu kota dari negara ini?", flag: "🇷🇺", ans: "Moskow", wrong: ["St. Petersburg", "Novosibirsk", "Kazan"] }
  ];

  let questions = [];
  let currentQ = 0;
  let scoreP1 = 0, scoreP2 = 0;
  let isPlaying = false;
  let timer, botTimer, timeLeft = 100;
  const MAX_TIME = 100;
  const TOTAL_QUESTIONS = 15;
  
  const $ = id => document.getElementById(id);
  const faceInput = $('faceInput');
  const facePreview = $('facePreview');
  const uploadText = $('uploadText');
  const myAvatar = $('myAvatar');
  let hasFace = false;

  // Handle Upload Foto
  faceInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        facePreview.src = img.src;
        facePreview.style.display = 'block';
        uploadText.style.display = 'none';
        myAvatar.src = img.src;
        myAvatar.style.display = 'block';
        hasFace = true;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function shuffle(a) { return a.sort(() => Math.random() - 0.5); }

  function startGame() {
    // Ambil 15 soal acak
    questions = shuffle([...db]).slice(0, TOTAL_QUESTIONS);
    currentQ = 0;
    scoreP1 = 0; scoreP2 = 0;
    $('scoreP1').textContent = '0';
    $('scoreP2').textContent = '0';
    
    $('overlay').classList.add('hidden');
    $('overlayResult').style.display = 'none';
    
    isPlaying = true;
    loadQuestion();
  }

  function loadQuestion() {
    if (currentQ >= TOTAL_QUESTIONS) return endGame();
    
    const q = questions[currentQ];
    $('progressText').textContent = `SOAL ${currentQ + 1} / ${TOTAL_QUESTIONS}`;
    $('questionText').textContent = q.q;
    $('flagContainer').textContent = q.flag;
    
    const opts = shuffle([q.ans, ...q.wrong]);
    
    const optionsGrid = $('optionsGrid');
    optionsGrid.innerHTML = '';
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(btn, opt, q.ans);
      optionsGrid.appendChild(btn);
    });

    timeLeft = MAX_TIME;
    $('timerBar').style.width = '100%';
    $('timerBar').style.backgroundColor = 'var(--green)';
    
    clearInterval(timer);
    clearTimeout(botTimer);
    
    timer = setInterval(() => {
      timeLeft -= 1.5;
      $('timerBar').style.width = `${Math.max(0, timeLeft)}%`;
      
      if (timeLeft < 40) $('timerBar').style.backgroundColor = '#fbbf24';
      if (timeLeft < 20) $('timerBar').style.backgroundColor = 'var(--red)';

      if (timeLeft <= 0) {
        clearInterval(timer);
        timeUp(q.ans);
      }
    }, 50);

    // LOGIKA BOT: Delay jawab 2-4 detik, tingkat akurasi 60%
    botTimer = setTimeout(() => {
      if (!isPlaying || timeLeft <= 0) return;
      
      const botBtns = [...optionsGrid.children];
      const isBotCorrect = Math.random() > 0.4; // 60% benar
      const botAns = isBotCorrect ? q.ans : q.wrong[Math.floor(Math.random() * q.wrong.length)];
      const btn = botBtns.find(b => b.textContent === botAns);
      
      if (btn) {
        btn.classList.add('bot-pick');
        if (botAns === q.ans) {
          scoreP2++;
          $('scoreP2').textContent = scoreP2;
        }
      }
    }, 1500 + Math.random() * 2500); // Bot jawab lebih cepat dikit
  }

  function handleAnswer(btn, selected, correct) {
    if (!isPlaying || timeLeft <= 0) return;
    clearInterval(timer);
    clearTimeout(botTimer);
    
    const allBtns = [...$('optionsGrid').children];
    allBtns.forEach(b => b.disabled = true);
    
    if (selected === correct) {
      btn.classList.add('correct');
      scoreP1++;
      $('scoreP1').textContent = scoreP1;
      showFeedback('BENAR!', 'var(--green)');
    } else {
      btn.classList.add('wrong');
      allBtns.forEach(b => {
        if (b.textContent === correct) b.classList.add('correct');
      });
      showFeedback('SALAH', 'var(--red)');
    }
    
    setTimeout(() => {
      currentQ++;
      loadQuestion();
    }, 1200); // Jeda 1.2 detik biar bisa lihat hasil
  }

  function timeUp(correct) {
    const allBtns = [...$('optionsGrid').children];
    allBtns.forEach(b => {
      b.disabled = true;
      if (b.textContent === correct) b.classList.add('correct');
    });
    showFeedback('WAKTU HABIS', '#fbbf24');
    
    setTimeout(() => {
      currentQ++;
      loadQuestion();
    }, 1200);
  }

  function showFeedback(text, color) {
    const feedback = $('feedback');
    feedback.textContent = text;
    feedback.style.color = color;
    feedback.style.textShadow = `0 0 20px ${color}`;
    feedback.style.animation = 'none';
    void feedback.offsetWidth;
    feedback.style.animation = 'pop 1s forwards';
  }

  function endGame() {
    isPlaying = false;
    clearInterval(timer);
    clearTimeout(botTimer);
    
    let title = "SERI!";
    let color = "var(--txt)";
    if (scoreP1 > scoreP2) { title = "KAMU MENANG! 🎉"; color = "var(--green)"; }
    if (scoreP2 > scoreP1) { title = "KAMU KALAH 😢"; color = "var(--red)"; }
    
    $('resTitle').textContent = title;
    $('resTitle').style.color = color;
    $('resScore').innerHTML = `<span class="p1">${scoreP1}</span> - <span class="p2">${scoreP2}</span>`;
    $('overlayResult').style.display = 'block';
    $('overlay').classList.remove('hidden');
  }

  $('startBtn').onclick = startGame;
  $('restartBtn').onclick = () => {
    $('overlayResult').style.display = 'none';
    startGame();
  };
})();
</script>
</body>
  </html>
